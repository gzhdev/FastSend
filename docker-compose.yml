name: fastsend

services:
  app:
    # 离线导入：docker load < fastsend-image-<架构>.tar.gz
    image: fastsend:intranet
    # 能访问外网时可改为：ghcr.io/gzhdev/fastsend:latest
    container_name: fastsend
    restart: unless-stopped
    ports:
      # 只监听本机回环地址，由同机的 Nginx 反向代理对外提供服务
      - "127.0.0.1:3000:3000"
    environment:
      TZ: Asia/Shanghai
      # 同一网段直连保持为空；跨网段时填入内网 STUN/TURN，例如：
      # '[{"urls":"stun:10.0.0.5:3478"},{"urls":"turn:10.0.0.5:3478","username":"fastsend","credential":"密码"}]'
      NUXT_PUBLIC_ICE_SERVERS: '[]'
    volumes:
      # 宿主机目录需属主为 1000:1000
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/zh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
