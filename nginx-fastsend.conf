# FastSend 站点配置
# 放置位置：/etc/nginx/conf.d/fastsend.conf
# 使用前替换：server_name、证书路径

map $http_upgrade $fastsend_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fastsend_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    # 服务器启用了 IPv6 时再取消注释，关闭 IPv6 的机器上开启会导致 Nginx 启动失败
    # listen [::]:80;
    server_name fastsend.example.lan;

    return 301 https://$host$request_uri;
}

server {
    # Nginx 1.25.1 及以上可改为 listen 443 ssl; 加单独一行 http2 on;
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name fastsend.example.lan;

    ssl_certificate     /etc/nginx/ssl/fastsend.crt;
    ssl_certificate_key /etc/nginx/ssl/fastsend.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:fastsend_ssl:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/fastsend.access.log;
    error_log  /var/log/nginx/fastsend.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 信令 WebSocket：长连接，关闭缓冲，超时放宽
    location = /api/connect {
        proxy_pass http://fastsend_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fastsend_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 带哈希的静态资源，长期缓存
    location /_nuxt/ {
        proxy_pass http://fastsend_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker 不缓存，保证升级后客户端能及时拿到新版本
    location = /sw.js {
        proxy_pass http://fastsend_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://fastsend_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
