name: Build intranet image

on:
  push:
    branches: [intranet-deploy]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare names
        id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          platform='${{ matrix.platform }}'
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          echo "arch=${platform#linux/}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.names.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.pair }}

      - name: Export image tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: fastsend:intranet
          outputs: type=docker,dest=${{ runner.temp }}/fastsend-image.tar
          cache-from: type=gha,scope=${{ steps.names.outputs.pair }}

      - name: Compress image tarball
        run: |
          mkdir -p "${{ runner.temp }}/dist"
          gzip -c "${{ runner.temp }}/fastsend-image.tar" \
            > "${{ runner.temp }}/dist/fastsend-image-${{ steps.names.outputs.arch }}.tar.gz"
          ls -lh "${{ runner.temp }}/dist"

      - name: Upload image tarball
        uses: actions/upload-artifact@v7
        with:
          name: fastsend-image-${{ steps.names.outputs.arch }}
          path: ${{ runner.temp }}/dist/fastsend-image-${{ steps.names.outputs.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.names.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-arch manifest
    needs: image
    runs-on: ubuntu-24.04

    steps:
      - name: Prepare names
        id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/intranet-deploy' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.names.outputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect '${{ steps.names.outputs.image }}:${{ steps.meta.outputs.version }}'

  node-output:
    name: Node build output
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn build

      - name: Package output
        run: |
          mkdir -p "${{ runner.temp }}/dist"
          tar czf "${{ runner.temp }}/dist/fastsend-output.tar.gz" .output
          ls -lh "${{ runner.temp }}/dist"

      - name: Upload output
        uses: actions/upload-artifact@v7
        with:
          name: fastsend-output
          path: ${{ runner.temp }}/dist/fastsend-output.tar.gz
          compression-level: 0
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, manifest, node-output]
    runs-on: ubuntu-24.04

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: fastsend-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
